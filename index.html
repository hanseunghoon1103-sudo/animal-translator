<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini AI 동물소리 번역기 🐶🐱🦜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212; color: #ffffff;
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .app-container {
      position: relative; width: 100%; max-width: 480px; height: 90vh;
      background-color: #1a1a1a; border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column;
    }
    .video-section { position: relative; width: 100%; height: 45%; background-color: #000; flex-shrink: 0; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .audio-meter { position: absolute; top: 15px; left: 15px; width: 100px; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 3px; overflow: hidden; }
    .audio-bar { width: 0%; height: 100%; background: #2ed573; transition: width 0.1s ease; }
    .translation-section { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #18181c; }
    .log-item { background: rgba(255, 255, 255, 0.07); padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; animation: fadeIn 0.3s ease-out; border-left: 4px solid #70a1ff; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .log-item.loading { border-left-color: #eccc68; color: #eccc68; font-style: italic; }
    .animal-name { font-weight: bold; margin-right: 6px; color: #70a1ff; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 24px; }
    .start-btn { background: #ff4757; color: white; border: none; padding: 15px 32px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 24px; }
    .system-msg { text-align: center; color: #777; font-size: 0.85rem; margin-top: 10px; }
    #captureCanvas { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="overlay" id="startOverlay">
      <h2>🤖 Gemini AI 동물 번역기</h2>
      <p style="margin-top: 12px; color: #ccc; font-size: 0.9rem; line-height: 1.5;">
        카메라와 마이크 권한을 승인하면<br>실시간 화면과 소리를 Gemini AI가 분석합니다!
      </p>
      <button class="start-btn" id="startBtn">번역 시작하기</button>
    </div>

    <div class="video-section">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="audio-meter"><div class="audio-bar" id="audioBar"></div></div>
    </div>

    <div class="translation-section" id="translationLog">
      <div class="system-msg" id="systemMsg">🔊 소리가 감지되면 Gemini AI가 실시간 번역을 시작합니다.</div>
    </div>
  </div>

  <canvas id="captureCanvas"></canvas>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtbGWIViL-AmaOcL3HL0qg5TGc0nbP-vE8jv6x3uAs6mqoU-fmpK_v6vqkA2LahqA/exec";

    const webcam = document.getElementById('webcam');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const audioBar = document.getElementById('audioBar');
    const translationLog = document.getElementById('translationLog');
    const systemMsg = document.getElementById('systemMsg');
    const captureCanvas = document.getElementById('captureCanvas');

    let audioContext, analyser, microphone, isProcessing = false;
    const SOUND_THRESHOLD = 45;

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: true
        });
        webcam.srcObject = stream;
        startOverlay.style.display = 'none';
        initAudioAnalysis(stream);
      } catch (err) {
        alert('카메라 및 마이크 권한 승인이 필요합니다: ' + err.message);
      }
    });

    function initAudioAnalysis(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      analyser.fftSize = 256;
      microphone.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function detectSound() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
        const average = sum / bufferLength;

        audioBar.style.width = Math.min(100, (average / 100) * 100) + '%';

        if (average > SOUND_THRESHOLD && !isProcessing) {
          analyzeWithGemini();
        }
        requestAnimationFrame(detectSound);
      }
      detectSound();
    }

    function captureFrameBase64() {
      const context = captureCanvas.getContext('2d');
      captureCanvas.width = webcam.videoWidth || 320;
      captureCanvas.height = webcam.videoHeight || 240;
      context.drawImage(webcam, 0, 0, captureCanvas.width, captureCanvas.height);
      return captureCanvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    }

    async function analyzeWithGemini() {
      isProcessing = true;
      if (systemMsg) systemMsg.style.display = 'none';

      const loadingLog = document.createElement('div');
      loadingLog.className = 'log-item loading';
      loadingLog.innerText = '🤖 Gemini AI가 울음소리와 모습을 분석 중...';
      translationLog.prepend(loadingLog);
      translationLog.scrollTop = 0;

      try {
        const imageBase64 = captureFrameBase64();

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ imageBase64: imageBase64 })
        });

        const data = await response.json();

        // 성공 응답 체크
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const resJson = JSON.parse(data.candidates[0].content.parts[0].text);
          loadingLog.className = 'log-item';
          loadingLog.innerHTML = `<span class="animal-name">${resJson.animal} :</span>${resJson.translation}`;
        } 
        // Gemini API 에러 메시지가 온 경우
        else if (data.error) {
          throw new Error(data.error.message || JSON.stringify(data.error));
        } 
        else {
          throw new Error("응답 데이터 이상: " + JSON.stringify(data));
        }

      } catch (err) {
        console.error(err);
        loadingLog.className = 'log-item';
        loadingLog.style.borderLeftColor = '#ff4757';
        // ✨ 실제 에러 메시지를 화면에 직접 출력!
        loadingLog.innerHTML = `<span class="animal-name" style="color:#ff4757;">오류 내용 :</span>${err.message}`;
      }

      translationLog.scrollTop = 0;
      setTimeout(() => { isProcessing = false; }, 3000);
    }
  </script>
</body>
</html>
