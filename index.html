<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 AR 동물소리 번역기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090d16;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .header-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 5px;
      margin-bottom: 15px;
      color: #38edf8;
      text-shadow: 0 0 10px rgba(56, 237, 248, 0.3);
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #1f293d;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; }
    .camera-overlay {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      z-index: 10;
    }
    .rec-dot {
      width: 8px; height: 8px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .btn-start-camera {
      margin-top: 15px;
      background-color: #238636;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      transition: all 0.2s;
    }
    .btn-start-camera.active { background-color: #da3633; box-shadow: none; }

    #translator-terminal {
      width: 100%;
      max-width: 500px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      margin-top: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }
    .terminal-header {
      background-color: #161b22;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #30363d;
      position: relative;
    }
    .terminal-buttons { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }
    .terminal-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-family: monospace; font-size: 0.75rem; color: #8b949e; font-weight: bold;
    }
    .terminal-body {
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 130px;
    }
    .terminal-line { margin-bottom: 8px; word-break: break-all; }
    .species-line { color: #79c0ff; }
    .animal-line { color: #d2a8ff; font-weight: bold; }
    .translation-line { color: #7ee787; font-size: 1.05rem; font-weight: bold; }
    .status-line { color: #8b949e; font-style: italic; }

    .blinking-cursor {
      display: inline-block; width: 7px; height: 14px;
      background-color: #7ee787; margin-left: 4px;
      vertical-align: middle; animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="header-title">📡 LIVE AR ANIMAL DECODER</div>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="camera-overlay">
      <span class="rec-dot"></span> LIVE SCAN
    </div>
  </div>

  <button id="btn-camera" class="btn-start-camera" onclick="startLiveCamera()">🎥 실시간 라이브 카메라 시작</button>

  <div id="translator-terminal">
    <div class="terminal-header">
      <div class="terminal-buttons">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="terminal-title">AI_STREAM_SCANNER_v2.0</div>
    </div>
    <div class="terminal-body">
      <div id="status-text" class="terminal-line status-line">> 상단 버튼을 눌러 실시간 스캔을 시작하세요...</div>
      <div id="species-info-typed" class="terminal-line species-line"></div>
      <div id="animal-name-typed" class="terminal-line animal-line"></div>
      <div id="translation-text-typed" class="terminal-line translation-line"></div>
      <span class="blinking-cursor"></span>
    </div>
  </div>

  <canvas id="frame-canvas"></canvas>

  <script>
    // ⚠️ 여기에 앱스크립트 배포 URL을 입력해 주세요!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/library/d/1fCTakbiJnQWoZ7GL1MwK3gNEe0CzGJUfG8PFg7VyvXhcQrPLqWw12Z06/33';

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('frame-canvas');
    let isLiveActive = false;
    let isProcessing = false;
    let autoScanInterval = null;

    async function startLiveCamera() {
      const btn = document.getElementById('btn-camera');

      if (isLiveActive) {
        stopCamera();
        return;
      }

      try {
        document.getElementById('status-text').innerText = '> [CAMERA_CONNECTING] 스마트폰 카메라 연결 중...';

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
          });
        } catch (fallbackErr) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        video.srcObject = stream;
        await video.play();

        isLiveActive = true;
        btn.innerText = '⏹️ 실시간 스캔 중지';
        btn.classList.add('active');
        document.getElementById('status-text').innerText = '> [LIVE_ONLINE] 카메라가 활성화되었습니다. 동물을 비춰주세요...';

        startAutoScanLoop();

      } catch (err) {
        console.error("카메라 연결 에러:", err);
        document.getElementById('status-text').innerText = '> [ERROR] 카메라를 켤 수 없습니다. 브라우저 권한을 확인해 주세요.';
      }
    }

    function stopCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      if (autoScanInterval) clearInterval(autoScanInterval);

      isLiveActive = false;
      isProcessing = false;
      const btn = document.getElementById('btn-camera');
      btn.innerText = '🎥 실시간 라이브 카메라 시작';
      btn.classList.remove('active');
      document.getElementById('status-text').innerText = '> 실시간 스캔이 중지되었습니다.';
    }

    function startAutoScanLoop() {
      if (autoScanInterval) clearInterval(autoScanInterval);
      autoScanInterval = setInterval(() => {
        if (isLiveActive && !isProcessing && video.videoWidth > 0) {
          captureCurrentFrameAndSend();
        }
      }, 3000);
    }

    async function captureCurrentFrameAndSend() {
      isProcessing = true;
      document.getElementById('status-text').innerText = '> [AI SCANNING...] 현재 라이브 화면 분석 중...';

      canvas.width = 320;
      canvas.height = 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ imageBase64: base64Image })
        });

        const data = await response.json();

        if (!isLiveActive) return;

        if (data.error) {
          if (data.error.message === "NO_ANIMAL") {
            document.getElementById('status-text').innerText = '> [SEARCHING...] 화면에 동물이 탐지되지 않았습니다.';
          } else {
            document.getElementById('status-text').innerText = '> [ERROR] ' + data.error.message;
          }
        } else {
          document.getElementById('status-text').innerText = '> [TARGET_LOCKED] 분석 완료!';
          const resultJson = JSON.parse(data.candidates[0].content.parts[0].text);

          await typeText('species-info-typed', `> SPECIES    : ${resultJson.species_info}`);
          await typeText('animal-name-typed', `> TARGET     : ${resultJson.animal}`);
          await typeText('translation-text-typed', `> TRANSLATION: "${resultJson.translation}"`);
        }
      } catch (err) {
        console.error(err);
        document.getElementById('status-text').innerText = '> [ERROR] 서버 통신 실패';
      } finally {
        isProcessing = false;
      }
    }

    function typeText(elementId, text, speed = 35) {
      return new Promise((resolve) => {
        const el = document.getElementById(elementId);
        el.innerHTML = '';
        let index = 0;

        function type() {
          if (index < text.length) {
            el.innerHTML += text.charAt(index);
            index++;
            setTimeout(type, speed);
          } else {
            resolve();
          }
        }
        type();
      });
    }
  </script>
</body>
</html>
