<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIVE CAM Animal Decoder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090d16;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .header-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 5px;
      margin-bottom: 15px;
      color: #38edf8;
      text-shadow: 0 0 10px rgba(56, 237, 248, 0.3);
    }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #1f293d;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; }
    #frozen-img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      z-index: 5;
    }
    .camera-overlay {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      z-index: 10;
    }
    .rec-dot {
      width: 8px; height: 8px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .btn-start-camera {
      margin-top: 15px;
      background-color: #238636;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      transition: all 0.2s;
    }
    .btn-start-camera.active { background-color: #da3633; box-shadow: none; }

    #translator-terminal {
      width: 100%;
      max-width: 500px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      margin-top: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }
    .terminal-header {
      background-color: #161b22;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #30363d;
      position: relative;
    }
    .terminal-buttons { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }
    .terminal-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-family: monospace; font-size: 0.8rem; color: #38edf8; font-weight: bold;
    }
    
    .terminal-body {
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .terminal-line-item {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #21262d;
      word-break: break-all;
    }
    .breed-text { color: #d2a8ff; font-weight: bold; }
    .trans-text { color: #7ee787; font-weight: bold; }
    .status-line { color: #8b949e; font-style: italic; }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="header-title">📡 LIVE CAM Animal Decoder</div>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <img id="frozen-img" alt="마지막 스캔 이미지">
    <div class="camera-overlay">
      <span class="rec-dot"></span> LIVE SCAN
    </div>
  </div>

  <button id="btn-camera" class="btn-start-camera" onclick="startLiveCamera()">🎥 실시간 라이브 카메라 시작</button>

  <div id="translator-terminal">
    <div class="terminal-header">
      <div class="terminal-buttons">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div id="terminal-status" class="terminal-title">Ready..</div>
    </div>
    <div class="terminal-body" id="terminal-body">
      <div id="status-line" class="status-line">> 동물을 카메라에 비춰주세요...</div>
      <div id="history-container"></div>
    </div>
  </div>

  <canvas id="frame-canvas"></canvas>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzT_6ruthtyo-o7avG86r0Iuy5y7nNcuzKmY6ANpy_Ym3OK947Z9S_JD-SgOTUA-mqR/exec';

    const video = document.getElementById('webcam');
    const frozenImg = document.getElementById('frozen-img');
    const canvas = document.getElementById('frame-canvas');
    const statusHeader = document.getElementById('terminal-status');
    const historyContainer = document.getElementById('history-container');
    const statusLine = document.getElementById('status-line');
    const terminalBody = document.getElementById('terminal-body');

    let isLiveActive = false;
    let autoScanTimeout = null;
    let lastDataUrl = '';

    async function startLiveCamera() {
      const btn = document.getElementById('btn-camera');

      if (isLiveActive) {
        stopCamera();
        return;
      }

      historyContainer.innerHTML = '';
      statusLine.style.display = 'block';
      statusLine.innerText = '> 동물을 카메라에 비춰주세요...';
      frozenImg.style.display = 'none';

      try {
        statusHeader.innerText = 'Ready..';

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
          });
        } catch (fallbackErr) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        video.srcObject = stream;
        await video.play();

        isLiveActive = true;
        btn.innerText = '⏹️ 실시간 스캔 중지';
        btn.classList.add('active');

        triggerChainedScan();

      } catch (err) {
        console.error("카메라 연결 에러:", err);
      }
    }

    function stopCamera() {
      isLiveActive = false;

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      if (autoScanTimeout) clearTimeout(autoScanTimeout);

      if (lastDataUrl) {
        frozenImg.src = lastDataUrl;
        frozenImg.style.display = 'block';
      }

      const btn = document.getElementById('btn-camera');
      btn.innerText = '🎥 실시간 라이브 카메라 시작';
      btn.classList.remove('active');
      statusHeader.innerText = 'Ready..';
    }

    async function triggerChainedScan() {
      if (!isLiveActive || video.videoWidth === 0) return;

      statusHeader.innerText = 'AI Scanning...';

      // 📸 고화질 선명도 캡처 (640x480 / 품질 0.8)
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      lastDataUrl = canvas.toDataURL('image/jpeg', 0.8);
      const base64Image = lastDataUrl.split(',')[1];

      let nextDelay = 500;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ imageBase64: base64Image })
        });

        const data = await response.json();

        if (!isLiveActive) return;

        if (data.success) {
          statusHeader.innerText = 'Translated.';
          statusLine.style.display = 'none';
          await addNewTranslationItem(data.breed, data.translation);
          nextDelay = 1000;

        } else {
          if (data.isNoAnimal) {
            statusHeader.innerText = 'Searching..';
            statusLine.style.display = 'block';
            // ✂️ 요청하신 단축 문구 적용!
            statusLine.innerText = '> 화면에 동물이 탐지되지 않았습니다.';
            nextDelay = 1000; // 카메라 초점 확보를 위해 1초 대기
          } else {
            statusHeader.innerText = 'Ready..';
            statusLine.style.display = 'block';
            statusLine.innerText = '> [오류] ' + (data.error || "재시도 중...");
            nextDelay = 1500;
          }
        }

      } catch (err) {
        console.error("통신 에러:", err);
        if (isLiveActive) {
          statusHeader.innerText = 'Ready..';
          statusLine.style.display = 'block';
          statusLine.innerText = '> [연결 재시도 중...]';
          nextDelay = 1000;
        }
      } finally {
        if (isLiveActive) {
          autoScanTimeout = setTimeout(triggerChainedScan, nextDelay);
        }
      }
    }

    async function addNewTranslationItem(breed, translation) {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'terminal-line-item';

      const breedSpan = document.createElement('span');
      breedSpan.className = 'breed-text';
      
      const transSpan = document.createElement('span');
      transSpan.className = 'trans-text';

      itemDiv.appendChild(breedSpan);
      itemDiv.appendChild(document.createTextNode(' : '));
      itemDiv.appendChild(transSpan);

      historyContainer.insertBefore(itemDiv, historyContainer.firstChild);
      terminalBody.scrollTop = 0;

      await typeText(breedSpan, `> [${breed}]`);
      await typeText(transSpan, `"${translation}"`);
    }

    function typeText(element, text, speed = 15) {
      return new Promise((resolve) => {
        element.innerText = '';
        let index = 0;

        function type() {
          if (index < text.length) {
            element.innerText += text.charAt(index);
            index++;
            setTimeout(type, speed);
          } else {
            resolve();
          }
        }
        type();
      });
    }
  </script>
</body>
</html>
