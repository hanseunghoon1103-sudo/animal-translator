<script>
  // =========================================================================
  // 🔗 구글 앱스크립트 웹 앱 URL을 아래에 붙여넣으세요.
  // =========================================================================
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtbGWIViL-AmaOcL3HL0qg5TGc0nbP-vE8jv6x3uAs6mqoU-fmpK_v6vqkA2LahqA/exec";
  // =========================================================================

  // (중략 ... 앞부분 동일)

  // Gemini 호출 함수를 앱스크립트 통신 방식으로 변경
  async function analyzeWithGemini() {
    isProcessing = true;

    if (systemMsg) systemMsg.style.display = 'none';

    const loadingLog = document.createElement('div');
    loadingLog.className = 'log-item loading';
    loadingLog.innerText = '🤖 Gemini AI가 울음소리와 동물의 모습을 분석 중...';
    translationLog.appendChild(loadingLog);
    translationLog.scrollTop = translationLog.scrollHeight;

    try {
      const imageBase64 = captureFrameBase64();

      // 내 구글 앱스크립트로 이미지 보냄 (API 키가 노출되지 않음!)
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // GAS CORS 이슈 방지용
        body: JSON.stringify({ imageBase64: imageBase64 })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        const resJson = JSON.parse(data.candidates[0].content.parts[0].text);

        loadingLog.className = 'log-item';
        loadingLog.innerHTML = `<span class="animal-name">${resJson.animal} :</span>${resJson.translation}`;
      } else {
        throw new Error("분석 실패");
      }

    } catch (err) {
      console.error(err);
      loadingLog.className = 'log-item';
      loadingLog.style.borderLeftColor = '#ff4757';
      loadingLog.innerHTML = `<span class="animal-name" style="color:#ff4757;">오류 :</span>AI 분석 실패 (백엔드 통신 상태 확인 필요)`;
    }

    translationLog.scrollTop = translationLog.scrollHeight;

    setTimeout(() => {
      isProcessing = false;
    }, 3000);
  }
</script>
